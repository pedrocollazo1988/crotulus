  <rect x="185" y="358" width="80" height="8" rx="4" fill="#FFFFFF" opacity=".9"/>

  <!-- carrito flotante -->
  <g transform="translate(560 330)">
    <circle cx="60" cy="60" r="58" fill="#00C2B8"/>
    <circle cx="60" cy="60" r="58" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".4"/>
    <path d="M32 40 h14 l8 40 h34 l8 -28 h-46" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="92" r="6" fill="#FFFFFF"/>
