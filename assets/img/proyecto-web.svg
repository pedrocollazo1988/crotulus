<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustración: desarrollo web y tienda online">
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FB"/>
      <stop offset="1" stop-color="#F4F9FE"/>
    </linearGradient>
    <linearGradient id="barW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005AA5"/>
      <stop offset="1" stop-color="#00C2B8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgW)"/>
  <!-- nodos de fondo -->
  <g stroke="#CFE4F7" stroke-width="2" fill="none" opacity=".7">
    <path d="M60 440 L140 400 L240 430 L340 390"/>
    <path d="M620 60 L700 100 L760 70"/>
