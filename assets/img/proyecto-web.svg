    <rect x="185" y="195" width="110" height="80" rx="10" fill="#A9D2F0"/>
    <path d="M215 255 L230 235 L245 250 L258 230 L275 255 Z" fill="#005AA5" opacity=".55"/>
    <circle cx="212" cy="212" r="9" fill="#00C2B8"/>
    <rect x="185" y="288" width="80" height="10" rx="5" fill="#7A7A7A" opacity=".6"/>
    <rect x="185" y="304" width="50" height="10" rx="5" fill="#00C2B8"/>

    <rect x="330" y="175" width="150" height="150" rx="14" fill="#EAF2FB" stroke="#CFE4F7" stroke-width="2"/>
    <rect x="350" y="195" width="110" height="80" rx="10" fill="#A9D2F0"/>
    <path d="M380 255 L395 235 L410 250 L423 230 L440 255 Z" fill="#005AA5" opacity=".55"/>
    <circle cx="377" cy="212" r="9" fill="#00C2B8"/>
    <rect x="350" y="288" width="80" height="10" rx="5" fill="#7A7A7A" opacity=".6"/>
    <rect x="350" y="304" width="50" height="10" rx="5" fill="#00C2B8"/>

    <rect x="495" y="175" width="150" height="150" rx="14" fill="#EAF2FB" stroke="#CFE4F7" stroke-width="2"/>
    <rect x="515" y="195" width="110" height="80" rx="10" fill="#A9D2F0"/>
    <path d="M545 255 L560 235 L575 250 L588 230 L605 255 Z" fill="#005AA5" opacity=".55"/>
    <circle cx="542" cy="212" r="9" fill="#00C2B8"/>
    <rect x="515" y="288" width="80" height="10" rx="5" fill="#7A7A7A" opacity=".6"/>
    <rect x="515" y="304" width="50" height="10" rx="5" fill="#00C2B8"/>
