    <circle cx="340" cy="390" r="5"/><circle cx="620" cy="60" r="5"/><circle cx="700" cy="100" r="5"/>
  </g>

  <!-- ventana de navegador -->
  <rect x="130" y="90" width="540" height="330" rx="18" fill="#FFFFFF" stroke="#DFE6F0" stroke-width="2"/>
  <rect x="130" y="90" width="540" height="52" rx="18" fill="url(#barW)"/>
  <rect x="130" y="124" width="540" height="18" fill="url(#barW)"/>
  <circle cx="164" cy="116" r="6" fill="#FFFFFF" opacity=".85"/>
  <circle cx="186" cy="116" r="6" fill="#FFFFFF" opacity=".6"/>
  <circle cx="208" cy="116" r="6" fill="#FFFFFF" opacity=".4"/>
  <rect x="250" y="106" width="300" height="20" rx="10" fill="#FFFFFF" opacity=".35"/>

