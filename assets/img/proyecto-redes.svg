<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustración: redes y ciberseguridad">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FB"/>
      <stop offset="1" stop-color="#F4F9FE"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgN)"/>

  <!-- red de nodos -->
  <g stroke="#CFE4F7" stroke-width="2.5" fill="none" opacity=".9">
    <path d="M400 250 L180 130"/>
    <path d="M400 250 L620 120"/>
    <path d="M400 250 L640 380"/>
    <path d="M400 250 L170 380"/>
    <path d="M400 250 L400 70"/>
    <path d="M180 130 L90 250"/>
    <path d="M620 120 L740 230"/>
    <path d="M640 380 L760 430"/>
    <path d="M170 380 L70 430"/>
    <path d="M400 70 L620 120"/>
    <path d="M180 130 L400 70"/>
  </g>
  <g fill="#A9D2F0">
    <circle cx="180" cy="130" r="7"/><circle cx="620" cy="120" r="7"/><circle cx="640" cy="380" r="7"/>
    <circle cx="170" cy="380" r="7"/><circle cx="400" cy="70" r="7"/><circle cx="90" cy="250" r="6"/>
    <circle cx="740" cy="230" r="6"/><circle cx="760" cy="430" r="6"/><circle cx="70" cy="430" r="6"/>
  </g>

  <!-- escudo central -->
  <g transform="translate(400 250)">
    <circle cx="0" cy="0" r="96" fill="#FFFFFF" stroke="#DFE6F0" stroke-width="2"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#00C2B8" stroke-width="3" opacity=".5"/>
    <path d="M0 -60 L48 -38 V6 C48 42 26 66 0 78 C-26 66 -48 42 -48 6 V-38 Z" fill="#005AA5"/>
    <path d="M-20 4 L-6 18 L24 -16" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- nodos satelite destacados -->
  <g fill="#005AA5">
    <circle cx="180" cy="130" r="22"/>
    <circle cx="620" cy="120" r="22"/>
    <circle cx="640" cy="380" r="22"/>
    <circle cx="170" cy="380" r="22"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="180" cy="130" r="8"/><circle cx="620" cy="120" r="8"/>
    <circle cx="640" cy="380" r="8"/><circle cx="170" cy="380" r="8"/>
  </g>

  <!-- candado pequeño -->
  <g transform="translate(660 300)">
    <rect x="-26" y="-6" width="52" height="44" rx="10" fill="#00C2B8"/>
    <path d="M-14 -6 v-12 a14 14 0 0 1 28 0 v12" fill="none" stroke="#00C2B8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="16" r="6" fill="#FFFFFF"/>
  </g>
</svg>
