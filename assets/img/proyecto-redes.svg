<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Red de oficinas protegida con firewall y nodos de seguridad conectados por cableado profesional">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FBFF"/><stop offset="1" stop-color="#CCE5F4"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FC0E0"/><stop offset="1" stop-color="#2E86B8" stop-opacity="0"/></linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C577A"/><stop offset="1" stop-color="#0B2E45"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#8ECBEA"/><stop offset="1" stop-color="#136493"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2E45" flood-opacity=".18"/></filter>
    <clipPath id="clip"><rect width="800" height="500" rx="24"/></clipPath>
    <style>
      .f{animation:f 7s ease-in-out infinite}
      .f2{animation:f 8.8s ease-in-out infinite;animation-delay:-2.2s}
      .blink{animation:pulse 2.6s ease-in-out infinite}
      .blink2{animation:pulse 3.4s ease-in-out infinite;animation-delay:-1.2s}
      .trace{stroke-dasharray:6 8;animation:dash 9s linear infinite}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes dash{to{stroke-dashoffset:-140}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.f,.f2,.blink,.blink2,.trace{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="500" fill="url(#bg)"/>
    <g class="trace" stroke="#2E86B8" fill="none" stroke-width="2" opacity=".28">
      <path d="M28 80 H150 V150"/><path d="M772 118 H650 V190"/><path d="M36 452 V392 H150"/>
    </g>
    <circle cx="700" cy="110" r="160" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

    <!-- Nodos de red (izquierda) -->
    <g fill="#136493"><circle cx="150" cy="150" r="13"/><circle cx="110" cy="250" r="13"/><circle cx="150" cy="350" r="13"/></g>
    <g fill="#5FA8C9"><circle cx="150" cy="150" r="5.5"/><circle cx="110" cy="250" r="5.5"/><circle cx="150" cy="350" r="5.5"/></g>
    <g stroke="#2E86B8" stroke-width="2.4" opacity=".6" fill="none">
      <path d="M150 150 L300 200 L150 250"/>
      <path d="M150 250 L300 300 L150 350"/>
      <path d="M150 150 V350"/>
    </g>

    <!-- Armario de red (rack) -->
    <g filter="url(#ds)">
      <rect x="300" y="70" width="320" height="350" rx="18" fill="url(#rack)"/>
      <rect x="318" y="90" width="284" height="52" rx="10" fill="#12405E"/>
      <rect x="318" y="156" width="284" height="52" rx="10" fill="#12405E"/>
      <rect x="318" y="222" width="284" height="52" rx="10" fill="#12405E"/>
      <rect x="318" y="288" width="284" height="52" rx="10" fill="#12405E"/>
      <rect x="318" y="354" width="284" height="48" rx="10" fill="#12405E"/>
      <g class="blink" fill="#5FA8C9"><circle cx="344" cy="116" r="5"/><circle cx="344" cy="182" r="5"/><circle cx="344" cy="248" r="5"/><circle cx="344" cy="378" r="5"/></g>
      <g class="blink2" fill="#38C08A"><circle cx="344" cy="314" r="5"/></g>
      <g fill="#3E93C4" opacity=".75">
        <rect x="368" y="106" width="150" height="8" rx="4"/><rect x="368" y="130" width="110" height="8" rx="4"/>
        <rect x="368" y="172" width="170" height="8" rx="4"/><rect x="368" y="196" width="120" height="8" rx="4"/>
        <rect x="368" y="238" width="150" height="8" rx="4"/><rect x="368" y="262" width="100" height="8" rx="4"/>
        <rect x="368" y="304" width="160" height="8" rx="4"/><rect x="368" y="328" width="130" height="8" rx="4"/>
        <rect x="368" y="370" width="140" height="8" rx="4"/><rect x="368" y="390" width="110" height="8" rx="4"/>
      </g>
    </g>

    <!-- Escudo de firewall flotante -->
    <g class="f" filter="url(#ds)">
      <circle cx="640" cy="352" r="58" fill="#FFFFFF"/>
      <path d="M640 306 l32 11 v26 c0 22 -19 34 -32 40 c-13 -6 -32 -18 -32 -40 v-26 z" fill="url(#orb)"/>
      <path d="M626 346 l10 11 l20 -24" fill="none" stroke="#EAF4FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Etiqueta de cableado estructurado -->
    <g class="f2" filter="url(#ds)">
      <rect x="40" y="330" width="140" height="86" rx="16" fill="#FFFFFF"/>
      <rect x="40" y="330" width="6" height="86" rx="3" fill="#136493"/>
      <rect x="62" y="348" width="70" height="10" rx="5" fill="#136493"/>
      <rect x="62" y="366" width="96" height="8" rx="4" fill="#9EC6E0"/>
      <rect x="62" y="382" width="60" height="8" rx="4" fill="#C5E2F2"/>
      <circle cx="150" cy="382" r="10" fill="#2E86B8"/>
      <path d="M145 382 l4 4 l7 -8" fill="none" stroke="#EAF4FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect y="442" width="800" height="58" fill="#C7DEF0" opacity=".85"/>
  </g>
</svg>
