<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Equipo de profesionales de C-ROTULUS trabajando en un proyecto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F9FD"/><stop offset="1" stop-color="#D8EAF6"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E86B8"/><stop offset="1" stop-color="#136493"/></linearGradient>
    <clipPath id="clip"><rect width="640" height="420" rx="22"/></clipPath>
    <style>
      .bob{animation:bob 5s ease-in-out infinite}
      .bob2{animation:bob 6.4s ease-in-out infinite;animation-delay:-1.6s}
      .bob3{animation:bob 7.6s ease-in-out infinite;animation-delay:-3.2s}
      .bob4{animation:bob 8.6s ease-in-out infinite;animation-delay:-4.6s}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .wave{transform-box:fill-box;transform-origin:0% 60%;animation:wave 3.6s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes pulse{0%,100%{opacity:.30}50%{opacity:.9}}
      @keyframes wave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-15deg)}}
      @media (prefers-reduced-motion: reduce){.bob,.bob2,.bob3,.bob4,.pulse,.wave{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
