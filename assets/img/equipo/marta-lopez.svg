<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Retrato de Marta López, Directora de proyectos en C-ROTULUS">
  <defs>
    <linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3F9FD"/><stop offset="1" stop-color="#D8EAF6"/></linearGradient>
    <clipPath id="clip0"><rect width="400" height="400" rx="28"/></clipPath>
    <style>
      .bob{animation:bob 5s ease-in-out infinite}
      .bob2{animation:bob 6.4s ease-in-out infinite;animation-delay:-1.6s}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes pulse{0%,100%{opacity:.30}50%{opacity:.9}}
      @media (prefers-reduced-motion: reduce){.bob,.bob2,.pulse{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip0)">
    <rect width="400" height="400" fill="url(#bg0)"/>
    <g fill="#2E86B8" opacity=".10"><circle cx="330" cy="80" r="60"/><circle cx="70" cy="330" r="52"/></g>
    <circle cx="200" cy="180" r="120" fill="#C5E2F2" opacity=".55"/>
    <!-- hombros -->
    <path d="M60 400 q0 -120 140 -120 q140 0 140 120 z" fill="#136493"/>
    <rect x="182" y="228" width="36" height="60" rx="16" fill="#F2CDA8"/>
    <path d="M60 400 q0 -120 140 -120 q140 0 140 120 z" fill="none" stroke="rgba(11,46,69,.12)" stroke-width="3"/>
    <!-- cabeza -->
    <g class="bob">
      <circle cx="200" cy="168" r="76" fill="#F2CDA8"/>
      <path d="M124 168 a76 76 0 0 1 152 0 q-40 -26 -76 -26 q-36 0 -76 26 z" fill="#3B3F46"/>
      <circle cx="176" cy="176" r="7" fill="#2A2E34"/><circle cx="224" cy="176" r="7" fill="#2A2E34"/>
      <path d="M182 206 q18 14 36 0" fill="none" stroke="#2A2E34" stroke-width="4" stroke-linecap="round"/>
    </g>
    <rect x="150" y="330" width="100" height="12" rx="6" fill="rgba(255,255,255,.5)"/>
  </g>
</svg>
