<!--
  ============================================================
  LOGO C-ROTULUS S.U.R.L.  (marcador editable)
  ------------------------------------------------------------
  Hecho en SVG vectorial para que se vea nítido en cualquier
  tamaño y pese muy poco. Si tienes el logo original en PNG,
  guardalo como assets/img/logo.png y cambia en index.html la
  etiqueta <img class="brand__img" src="assets/img/logo-c-rotulus.svg">
  por src="assets/img/logo.png".
  Paleta usada aqui:
    - Azul principal:  #1E6BE6
    - Azul profundo:   #0B3FA6
    - Gris textos:     #3A4453
    - Acento (cian):   #00B8D9
  ============================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-label="C-ROTULUS S.U.R.L.">
  <defs>
    <linearGradient id="crBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7BF0"/>
      <stop offset="1" stop-color="#0B3FA6"/>
    </linearGradient>
  </defs>

  <!-- Letra C formada por una pista de circuito -->
  <path d="M60 24 A46 46 0 1 0 60 116"
        fill="none" stroke="url(#crBlue)" stroke-width="16" stroke-linecap="round"/>

  <!-- Nodos y pistas del circuito (acento cian) -->
  <g stroke="#00B8D9" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M16 40 H26"/>
    <path d="M16 100 H26"/>
    <path d="M60 24 V12"/>
  </g>
  <g fill="#00B8D9">
    <circle cx="11" cy="40" r="5"/>
    <circle cx="11" cy="100" r="5"/>
    <circle cx="60" cy="11" r="5"/>
  </g>

  <!-- Guion de "C-" tambien en azul -->
  <path d="M118 70 H142" stroke="url(#crBlue)" stroke-width="16" stroke-linecap="round"/>

  <!-- Palabra ROTULUS en gris oscuro -->
  <text x="160" y="93" font-family="Inter, 'Segoe UI', Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="2.5" fill="#3A4453">ROTULUS</text>
</svg>
