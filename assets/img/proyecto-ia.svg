<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustración: automatización y agentes de IA">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF2FB"/>
      <stop offset="1" stop-color="#F4F9FE"/>
    </linearGradient>
    <linearGradient id="bubbleA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005AA5"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgA)"/>

  <!-- red neuronal de fondo -->
  <g stroke="#CFE4F7" stroke-width="2" fill="none" opacity=".85">
    <path d="M90 120 L180 90 L270 130 L360 95"/>
    <path d="M90 120 L170 180 L270 130"/>
    <path d="M360 95 L450 140 L540 105"/>
    <path d="M450 140 L470 60"/>
    <path d="M700 400 L620 430 L540 400 L470 440"/>
    <path d="M700 400 L640 350 L540 400"/>
    <path d="M290 300 L380 330 L470 300"/>
  </g>
  <g fill="#A9D2F0">
    <circle cx="90" cy="120" r="6"/><circle cx="180" cy="90" r="6"/><circle cx="270" cy="130" r="6"/>
    <circle cx="360" cy="95" r="6"/><circle cx="450" cy="140" r="6"/><circle cx="540" cy="105" r="6"/>
    <circle cx="470" cy="60" r="6"/><circle cx="700" cy="400" r="6"/><circle cx="620" cy="430" r="6"/>
    <circle cx="540" cy="400" r="6"/><circle cx="470" cy="440" r="6"/><circle cx="640" cy="350" r="6"/>
    <circle cx="170" cy="180" r="6"/><circle cx="290" cy="300" r="6"/><circle cx="380" cy="330" r="6"/><circle cx="470" cy="300" r="6"/>
  </g>

  <!-- tarjeta de chat -->
  <rect x="250" y="120" width="300" height="280" rx="20" fill="#FFFFFF" stroke="#DFE6F0" stroke-width="2"/>
  <rect x="250" y="120" width="300" height="54" rx="20" fill="url(#bubbleA)"/>
  <rect x="250" y="154" width="300" height="20" fill="url(#bubbleA)"/>
  <circle cx="286" cy="147" r="15" fill="#FFFFFF" opacity=".95"/>
  <path d="M279 147 l5 5 9 -11" fill="none" stroke="#005AA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="316" y="138" width="120" height="9" rx="4.5" fill="#FFFFFF" opacity=".85"/>
  <rect x="316" y="154" width="70" height="7" rx="3.5" fill="#FFFFFF" opacity=".5"/>

  <!-- burbujas de conversacion -->
  <rect x="275" y="200" width="200" height="44" rx="14" fill="#EAF2FB"/>
  <rect x="292" y="214" width="150" height="7" rx="3.5" fill="#7A7A7A" opacity=".55"/>
  <rect x="292" y="228" width="110" height="7" rx="3.5" fill="#7A7A7A" opacity=".35"/>

  <rect x="325" y="258" width="200" height="44" rx="14" fill="#00C2B8"/>
  <rect x="342" y="272" width="150" height="7" rx="3.5" fill="#FFFFFF" opacity=".9"/>
  <rect x="342" y="286" width="100" height="7" rx="3.5" fill="#FFFFFF" opacity=".6"/>

  <rect x="275" y="316" width="160" height="44" rx="14" fill="#EAF2FB"/>
  <rect x="292" y="330" width="120" height="7" rx="3.5" fill="#7A7A7A" opacity=".55"/>
  <rect x="292" y="344" width="80" height="7" rx="3.5" fill="#7A7A7A" opacity=".35"/>

  <!-- indicador escribiendo -->
  <g>
    <rect x="325" y="370" width="90" height="24" rx="12" fill="#CFE4F7"/>
    <circle cx="352" cy="382" r="4" fill="#005AA5"/>
    <circle cx="370" cy="382" r="4" fill="#005AA5" opacity=".6"/>
    <circle cx="388" cy="382" r="4" fill="#005AA5" opacity=".35"/>
  </g>

  <!-- chip de IA flotante -->
  <g transform="translate(600 130)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#005AA5"/>
    <rect x="34" y="34" width="42" height="42" rx="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="48" y="48" width="14" height="14" rx="4" fill="#00C2B8"/>
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      <path d="M55 20 v-14"/><path d="M55 104 v-14"/><path d="M20 55 h-14"/><path d="M104 55 h-14"/>
    </g>
  </g>
</svg>
