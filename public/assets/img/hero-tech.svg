<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Panel de control de C-ROTULUS con gráficas, servicios en la nube y una red de datos conectada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FBFF"/><stop offset="1" stop-color="#CCE5F4"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E93C4"/><stop offset="1" stop-color="#136493"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FC0E0"/><stop offset="1" stop-color="#136493"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FC0E0"/><stop offset="1" stop-color="#2E86B8" stop-opacity="0"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8ECBEA"/><stop offset="1" stop-color="#136493"/></radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2E45" flood-opacity=".18"/></filter>
    <clipPath id="clip"><rect width="640" height="480" rx="24"/></clipPath>
    <style>
      .f{animation:f 7s ease-in-out infinite}
      .f2{animation:f 8.6s ease-in-out infinite;animation-delay:-2.1s}
      .f3{animation:f 9.8s ease-in-out infinite;animation-delay:-4.3s}
      .trace{stroke-dasharray:7 9;animation:dash 10s linear infinite}
      .pulse{animation:pulse 3.4s ease-in-out infinite}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes dash{to{stroke-dashoffset:-160}}
      @keyframes pulse{0%,100%{opacity:.30}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.f,.f2,.f3,.trace,.pulse{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="640" height="480" fill="url(#bg)"/>

    <!-- Circuitos de fondo: trazas tenues con nodos que laten -->
    <g class="trace" stroke="#2E86B8" fill="none" stroke-width="2" opacity=".30">
      <path d="M28 70 H150 V128"/>
      <path d="M612 96 H512 V164"/>
      <path d="M36 430 V356 H120"/>
      <path d="M616 420 V348 H520"/>
      <path d="M150 128 L120 356"/>
    </g>
    <g class="pulse" fill="#5FA8C9"><circle cx="150" cy="128" r="6"/><circle cx="512" cy="164" r="6"/><circle cx="120" cy="356" r="6"/></g>
    <g fill="#2E86B8" opacity=".55"><circle cx="150" cy="128" r="3"/><circle cx="512" cy="164" r="3"/><circle cx="120" cy="356" r="3"/></g>

    <!-- Halo de marca -->
    <circle cx="500" cy="110" r="150" fill="url(#glow)" opacity=".55" filter="url(#soft)"/>

    <!-- Tarjeta flotante: Nube -->
    <g class="f3" filter="url(#ds)">
      <rect x="452" y="52" width="140" height="74" rx="16" fill="#FFFFFF"/>
      <rect x="452" y="52" width="6" height="74" rx="3" fill="#2E86B8"/>
      <path d="M492 66 a14 14 0 0 1 -1.5 -28 a18 18 0 0 1 34 -6 a15 15 0 0 1 18 14 a12 12 0 0 1 -3 20 z" fill="none" stroke="#136493" stroke-width="2.6"/>
      <path d="M486 92 h26 l6 14 h-38 z" fill="#2E86B8"/>
      <rect x="478" y="108" width="66" height="6" rx="3" fill="#C5E2F2"/>
    </g>

    <!-- Tarjeta flotante: Seguridad -->
    <g class="f2" filter="url(#ds)">
      <rect x="26" y="286" width="128" height="84" rx="16" fill="#FFFFFF"/>
      <path d="M90 300 l20 7 v16 c0 14 -12 22 -20 26 c-8 -4 -20 -12 -20 -26 v-16 z" fill="#136493"/>
      <path d="M82 328 l6 7 l12 -14" fill="none" stroke="#C5E2F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="352" width="88" height="7" rx="3.5" fill="#E1EDF5"/>
    </g>

    <!-- Ventana principal: panel de control -->
    <g filter="url(#ds)">
      <rect x="150" y="104" width="360" height="256" rx="18" fill="#FFFFFF"/>
      <rect x="150" y="104" width="360" height="40" rx="18" fill="url(#scr)"/>
      <rect x="150" y="128" width="360" height="16" fill="url(#scr)"/>
      <circle cx="172" cy="124" r="4.5" fill="#EAF4FA"/><circle cx="188" cy="124" r="4.5" fill="#8ECBEA"/><circle cx="204" cy="124" r="4.5" fill="#5FA8C9"/>
      <rect x="300" y="116" width="120" height="16" rx="8" fill="#0E4E75" opacity=".55"/>
      <!-- Barra lateral -->
      <rect x="164" y="158" width="70" height="188" rx="12" fill="#EAF3FA"/>
      <rect x="176" y="172" width="46" height="8" rx="4" fill="#136493"/>
      <rect x="176" y="192" width="34" height="7" rx="3.5" fill="#9EC6E0"/>
      <rect x="176" y="210" width="42" height="7" rx="3.5" fill="#9EC6E0"/>
      <rect x="176" y="228" width="30" height="7" rx="3.5" fill="#9EC6E0"/>
      <rect x="176" y="246" width="40" height="7" rx="3.5" fill="#9EC6E0"/>
      <!-- Cabecera del panel -->
      <rect x="250" y="164" width="150" height="12" rx="6" fill="#136493"/>
      <rect x="250" y="184" width="96" height="8" rx="4" fill="#9EC6E0"/>
      <!-- Grafica de barras -->
      <rect x="250" y="204" width="152" height="124" rx="12" fill="#F5FAFE" stroke="#DCEBF5"/>
      <g fill="url(#bar)">
        <rect x="266" y="272" width="16" height="42" rx="5"/>
        <rect x="290" y="252" width="16" height="62" rx="5"/>
        <rect x="314" y="286" width="16" height="28" rx="5"/>
        <rect x="338" y="234" width="16" height="80" rx="5"/>
        <rect x="362" y="262" width="16" height="52" rx="5"/>
      </g>
      <!-- Panel lateral de datos -->
      <rect x="414" y="204" width="80" height="58" rx="12" fill="#F5FAFE" stroke="#DCEBF5"/>
      <path d="M426 246 l14 -16 l12 10 l16 -20" fill="none" stroke="#2E86B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="414" y="270" width="80" height="58" rx="12" fill="#F5FAFE" stroke="#DCEBF5"/>
      <circle cx="440" cy="299" r="15" fill="none" stroke="#C5E2F2" stroke-width="6"/>
      <path d="M440 284 a15 15 0 0 1 13 22" fill="none" stroke="#136493" stroke-width="6" stroke-linecap="round"/>
      <rect x="462" y="292" width="24" height="6" rx="3" fill="#136493"/>
      <rect x="462" y="304" width="18" height="6" rx="3" fill="#9EC6E0"/>
    </g>

    <!-- Tarjeta flotante: IA / asistente -->
    <g class="f" filter="url(#ds)">
      <rect x="452" y="316" width="150" height="76" rx="16" fill="#0E4E75"/>
      <circle cx="482" cy="354" r="16" fill="url(#orb)"/>
      <path d="M476 354 h12 M482 348 v12" stroke="#EAF4FA" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="508" y="338" width="78" height="8" rx="4" fill="#8ECBEA"/>
      <rect x="508" y="354" width="58" height="8" rx="4" fill="#5FA8C9"/>
      <rect x="508" y="370" width="68" height="8" rx="4" fill="#3E93C4"/>
    </g>

    <!-- Suelo -->
    <rect y="424" width="640" height="56" fill="#C7DEF0" opacity=".85"/>
  </g>
</svg>
