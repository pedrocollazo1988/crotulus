<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Asistente de inteligencia artificial que responde consultas 24/7, conectado a la nube y a la base de datos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FBFF"/><stop offset="1" stop-color="#CCE5F4"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FC0E0"/><stop offset="1" stop-color="#2E86B8" stop-opacity="0"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#8ECBEA"/><stop offset="1" stop-color="#136493"/></radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3E93C4"/><stop offset="1" stop-color="#136493"/></linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="ds" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B2E45" flood-opacity=".18"/></filter>
    <clipPath id="clip"><rect width="800" height="500" rx="24"/></clipPath>
    <style>
      .f{animation:f 7s ease-in-out infinite}
      .f2{animation:f 8.8s ease-in-out infinite;animation-delay:-2.2s}
      .f3{animation:f 10s ease-in-out infinite;animation-delay:-4.4s}
      .pulse{animation:pulse 3.6s ease-in-out infinite}
      .trace{stroke-dasharray:6 8;animation:dash 9s linear infinite}
      @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes dash{to{stroke-dashoffset:-140}}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.f,.f2,.f3,.pulse,.trace{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="800" height="500" fill="url(#bg)"/>
    <circle cx="400" cy="250" r="210" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

    <!-- Nodo central: cerebro de IA -->
    <g class="f" filter="url(#ds)">
      <circle cx="400" cy="240" r="86" fill="#FFFFFF"/>
      <circle cx="400" cy="240" r="70" fill="url(#orb)"/>
      <path d="M372 214 a22 22 0 0 1 22 -18 a20 20 0 0 1 34 12 a18 18 0 0 1 6 34 a20 20 0 0 1 -30 30 a20 20 0 0 1 -32 -22 a18 18 0 0 1 0 -36 z" fill="none" stroke="#EAF4FA" stroke-width="3.2"/>
      <path d="M382 240 h14 M400 228 v24 M414 240 h14" stroke="#EAF4FA" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="382" cy="240" r="3.4" fill="#EAF4FA"/><circle cx="400" cy="228" r="3.4" fill="#EAF4FA"/><circle cx="414" cy="240" r="3.4" fill="#EAF4FA"/>
    </g>

    <!-- Conexiones -->
    <g class="trace" stroke="#2E86B8" fill="none" stroke-width="2.4" opacity=".45">
      <path d="M314 240 H214"/><path d="M486 240 H586"/><path d="M400 154 V82"/><path d="M356 302 L282 372"/><path d="M444 302 L518 372"/>
    </g>
    <g class="pulse" fill="#5FA8C9">
      <circle cx="264" cy="240" r="5"/><circle cx="536" cy="240" r="5"/><circle cx="400" cy="118" r="5"/>
    </g>

    <!-- Nube (arriba) -->
    <g class="f3" filter="url(#ds)">
      <rect x="316" y="34" width="168" height="52" rx="14" fill="#FFFFFF"/>
      <path d="M356 54 a10 10 0 0 1 -1 -20 a13 13 0 0 1 24 -4 a11 11 0 0 1 13 10 a9 9 0 0 1 -2 14 z" fill="none" stroke="#136493" stroke-width="2.4"/>
      <rect x="404" y="44" width="56" height="8" rx="4" fill="#2E86B8"/>
      <rect x="404" y="60" width="38" height="8" rx="4" fill="#C5E2F2"/>
    </g>

    <!-- Burbuja de conversacion (izquierda) -->
    <g class="f2" filter="url(#ds)">
      <rect x="60" y="196" width="156" height="60" rx="16" fill="#FFFFFF"/>
      <rect x="60" y="196" width="6" height="60" rx="3" fill="#2E86B8"/>
      <circle cx="88" cy="226" r="13" fill="#C5E2F2"/>
      <path d="M82 226 h12 M88 220 v12" stroke="#136493" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="110" y="214" width="86" height="8" rx="4" fill="#136493"/>
      <rect x="110" y="230" width="62" height="8" rx="4" fill="#9EC6E0"/>
    </g>

    <!-- Burbuja de respuesta (derecha, estilo chat IA) -->
    <g class="f2" filter="url(#ds)">
      <rect x="586" y="200" width="156" height="60" rx="16" fill="url(#chip)"/>
      <circle cx="614" cy="230" r="13" fill="#EAF4FA"/>
      <path d="M609 230 l4 4 l8 -9" fill="none" stroke="#136493" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="636" y="218" width="86" height="8" rx="4" fill="#EAF4FA"/>
      <rect x="636" y="234" width="60" height="8" rx="4" fill="#B9DDF1"/>
    </g>

    <!-- Tarjeta de datos (abajo dcha) -->
    <g class="f" filter="url(#ds)">
      <rect x="500" y="352" width="150" height="96" rx="16" fill="#FFFFFF"/>
      <rect x="500" y="352" width="6" height="96" rx="3" fill="#136493"/>
      <g fill="url(#chip)">
        <rect x="518" y="394" width="14" height="38" rx="5"/>
        <rect x="540" y="378" width="14" height="54" rx="5"/>
        <rect x="562" y="404" width="14" height="28" rx="5"/>
      </g>
      <rect x="588" y="372" width="46" height="8" rx="4" fill="#136493"/>
      <rect x="588" y="388" width="32" height="8" rx="4" fill="#9EC6E0"/>
      <rect x="588" y="412" width="40" height="8" rx="4" fill="#C5E2F2"/>
    </g>

    <!-- Panel de estado (abajo izq) -->
    <g class="f3" filter="url(#ds)">
      <rect x="150" y="360" width="140" height="88" rx="16" fill="#0E4E75"/>
      <circle cx="184" cy="392" r="14" fill="#2E86B8"/>
      <path d="M178 392 h12 M184 386 v12" stroke="#EAF4FA" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="208" y="380" width="60" height="8" rx="4" fill="#8ECBEA"/>
      <rect x="208" y="396" width="42" height="8" rx="4" fill="#5FA8C9"/>
      <rect x="170" y="420" width="100" height="8" rx="4" fill="#3E93C4"/>
    </g>

    <rect y="440" width="800" height="60" fill="#C7DEF0" opacity=".8"/>
  </g>
</svg>
